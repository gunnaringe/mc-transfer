name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B verify
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            velocity/target/mc-transfer-velocity.jar
            paper/target/mc-transfer-paper.jar
